<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RemoteDroid</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --fg:#e6e8ee; --muted:#8a90a0; --accent:#4f8cff; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; display: flex; flex-direction: column; }
  #login { margin: auto; background: var(--panel); padding: 28px; border-radius: 14px; width: 320px; text-align: center; }
  #login h1 { margin: 0 0 6px; font-size: 22px; }
  #login p { color: var(--muted); margin: 0 0 18px; }
  input[type=text], input[type=password] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c313c; background: #0f1115; color: var(--fg); font-size: 16px; }
  button { background: var(--accent); color: #fff; border: 0; padding: 9px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button.ghost { background: #232733; color: var(--fg); }
  button:hover { filter: brightness(1.12); }
  #login button { width: 100%; margin-top: 12px; padding: 11px; font-size: 15px; }
  #err { color: var(--bad); min-height: 18px; margin-top: 10px; }
  #app { display: none; flex: 1; min-height: 0; flex-direction: column; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; background: var(--panel); }
  #bar .sp { flex: 1; }
  #bar input { width: 220px; padding: 8px 10px; font-size: 14px; }
  #model { color: var(--muted); }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
  canvas { max-width: 100%; max-height: 100%; background: #000; border-radius: 10px; touch-action: none; cursor: crosshair; outline: none; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #2a1f1f; color: var(--bad); padding: 8px 14px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<div id="login">
  <h1>RemoteDroid</h1>
  <p>Enter the PIN shown on your phone</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="000000" autofocus>
  <button id="connect">Connect</button>
  <div id="err"></div>
</div>

<div id="app">
  <div id="bar">
    <button class="ghost" data-key="back" title="Back (Esc)">◀ Back</button>
    <button class="ghost" data-key="home">⬤ Home</button>
    <button class="ghost" data-key="recents">▣ Recents</button>
    <button class="ghost" data-key="notifications">Notifications</button>
    <button class="ghost" data-key="quicksettings">Quick settings</button>
    <button class="ghost" data-key="screenshot">Screenshot</button>
    <button class="ghost" id="wake">Wake</button>
    <button class="ghost" data-key="lock">Lock</button>
    <span class="sp"></span>
    <input id="txt" type="text" placeholder="Type text, press Enter to send">
    <button id="sendtxt">Send</button>
    <span id="model"></span>
  </div>
  <div id="stage"><canvas id="screen" tabindex="0"></canvas></div>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const canvas = $('screen'), ctx = canvas.getContext('2d');
let ws = null, authed = false;

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3500);
}
function send(o) { if (ws && ws.readyState === 1 && authed) ws.send(JSON.stringify(o)); }

function connect() {
  $('err').textContent = '';
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = 'blob';
  ws.onopen = () => ws.send(JSON.stringify({ type: 'auth', pin: $('pin').value.trim() }));
  ws.onmessage = e => {
    if (typeof e.data !== 'string') return draw(e.data);
    const m = JSON.parse(e.data);
    if (m.type === 'auth') {
      if (m.ok) {
        authed = true;
        $('login').style.display = 'none';
        $('app').style.display = 'flex';
        $('model').textContent = m.model || '';
        canvas.focus();
      } else {
        $('err').textContent = m.msg || 'Authentication failed';
      }
    } else if (m.type === 'error') {
      toast(m.msg);
    }
  };
  ws.onclose = () => {
    if (authed) {
      authed = false;
      $('app').style.display = 'none';
      $('login').style.display = 'block';
      $('err').textContent = 'Disconnected. Enter the PIN to reconnect.';
    } else if (!$('err').textContent) {
      $('err').textContent = 'Could not connect.';
    }
  };
}
$('connect').onclick = connect;
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });

// ---- Rendering (always show the newest frame) ----
let pending = null, drawing = false;
async function draw(blob) {
  pending = blob;
  if (drawing) return;
  drawing = true;
  while (pending) {
    const b = pending; pending = null;
    try {
      const bmp = await createImageBitmap(b);
      if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
        canvas.width = bmp.width; canvas.height = bmp.height;
      }
      ctx.drawImage(bmp, 0, 0);
      bmp.close();
    } catch (_) {}
  }
  drawing = false;
}

// ---- Pointer -> tap / long-press / swipe ----
function norm(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
    y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)),
  };
}
let down = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  canvas.focus();
  down = { p: norm(e), px: e.clientX, py: e.clientY, t: performance.now() };
});
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const up = norm(e), dt = performance.now() - down.t;
  const moved = Math.hypot(e.clientX - down.px, e.clientY - down.py);
  if (moved < 10) {
    send({ type: dt >= 500 ? 'longpress' : 'tap', x: down.p.x, y: down.p.y });
  } else {
    send({ type: 'swipe', x1: down.p.x, y1: down.p.y, x2: up.x, y2: up.y,
           dur: Math.round(Math.min(1500, Math.max(80, dt))) });
  }
  down = null;
});
canvas.addEventListener('pointercancel', () => down = null);
canvas.addEventListener('contextmenu', e => { e.preventDefault(); send({ type: 'key', key: 'back' }); });

let lastWheel = 0;
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const now = performance.now();
  if (now - lastWheel < 250) return;
  lastWheel = now;
  const p = norm(e), d = e.deltaY > 0 ? -0.25 : 0.25; // wheel down = finger swipes up
  send({ type: 'swipe', x1: p.x, y1: p.y, x2: p.x, y2: Math.min(1, Math.max(0, p.y + d)), dur: 200 });
}, { passive: false });

// ---- Keyboard / paste -> text on the phone ----
document.addEventListener('keydown', e => {
  if (!authed || e.target.tagName === 'INPUT') return;
  if (e.key === 'Backspace') { send({ type: 'backspace' }); e.preventDefault(); }
  else if (e.key === 'Enter') { send({ type: 'enter' }); e.preventDefault(); }
  else if (e.key === 'Escape') { send({ type: 'key', key: 'back' }); }
  else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    send({ type: 'text', text: e.key }); e.preventDefault();
  }
});
document.addEventListener('paste', e => {
  if (!authed || e.target.tagName === 'INPUT') return;
  const t = e.clipboardData.getData('text');
  if (t) send({ type: 'text', text: t });
});

// ---- Toolbar ----
document.querySelectorAll('[data-key]').forEach(b => b.onclick = () => send({ type: 'key', key: b.dataset.key }));
$('wake').onclick = () => send({ type: 'wake' });
function sendField() { const v = $('txt').value; if (v) { send({ type: 'text', text: v }); $('txt').value = ''; } }
$('sendtxt').onclick = sendField;
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter') sendField(); });
</script>
</body>
</html>
