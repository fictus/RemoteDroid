<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RemoteDroid</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --fg:#e6e8ee; --muted:#8a90a0; --accent:#4f8cff; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; display: flex; flex-direction: column; }
  #login { margin: auto; background: var(--panel); padding: 28px; border-radius: 14px; width: 320px; text-align: center; }
  #login h1 { margin: 0 0 6px; font-size: 22px; }
  #login p { color: var(--muted); margin: 0 0 18px; }
  input[type=text], input[type=password] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c313c; background: #0f1115; color: var(--fg); font-size: 16px; }
  button { background: var(--accent); color: #fff; border: 0; padding: 9px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button.ghost { background: #232733; color: var(--fg); }
  button:hover { filter: brightness(1.12); }
  #login button { width: 100%; margin-top: 12px; padding: 11px; font-size: 15px; }
  #err { color: var(--bad); min-height: 18px; margin-top: 10px; }
  #app { display: none; flex: 1; min-height: 0; flex-direction: column; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; background: var(--panel); }
  #bar .sp { flex: 1; }
  #bar input { width: 220px; padding: 8px 10px; font-size: 14px; }
  #model { color: var(--muted); }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
  video { max-width: 100%; max-height: 100%; background: #000; border-radius: 10px; touch-action: none; cursor: crosshair; outline: none; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #banner { display:none; background:#3a2d12; color:#ffd479; padding:8px 12px; text-align:center; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #2a1f1f; color: var(--bad); padding: 8px 14px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<div id="login">
  <h1>RemoteDroid</h1>
  <p>Enter the PIN shown on your phone</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autofocus>
  <button id="connect">Connect</button>
  <div id="err"></div>
</div>

<div id="app">
  <div id="bar">
    <button class="ghost" data-key="back" title="Back (Esc)">◀ Back</button>
    <button class="ghost" data-key="home">⬤ Home</button>
    <button class="ghost" data-key="recents">▣ Recents</button>
    <button class="ghost" data-key="notifications">Notifications</button>
    <button class="ghost" data-key="quicksettings">Quick settings</button>
    <button class="ghost" data-key="screenshot">Screenshot</button>
    <button class="ghost" id="wake">Wake</button>
    <button id="resume" style="display:none">Resume capture</button>
    <button class="ghost" data-key="lock">Lock</button>
    <span class="sp"></span>
    <input id="txt" type="text" placeholder="Type text, press Enter to send">
    <button id="sendtxt">Send</button>
    <span id="model"></span>
  </div>
  <div id="banner">Phone screen is locked, so Android paused screen capture. Unlock the phone and approve the prompt (or press Resume capture). The connection stays up.</div>
  <div id="stage"><video id="screen" tabindex="0" autoplay muted playsinline></video></div>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const video = $('screen');
let ws = null, pc = null, dc = null, authed = false, remoteSet = false, queued = [];

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3500);
}
function wsSend(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
// Input goes over the WebRTC data channel when open, else falls back to the WebSocket.
function send(o) {
  if (!authed) return;
  if (dc && dc.readyState === 'open') dc.send(JSON.stringify(o)); else wsSend(o);
}

function connect() {
  $('err').textContent = '';
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => wsSend({ type: 'auth', pin: $('pin').value.trim() });
  ws.onmessage = async e => {
    const m = JSON.parse(e.data);
    if (m.type === 'auth') {
      if (m.ok) {
        authed = true;
        $('login').style.display = 'none';
        $('app').style.display = 'flex';
        $('model').textContent = m.model || '';
        video.focus();
        startRtc();
      } else {
        $('err').textContent = m.msg || 'Authentication failed';
      }
    } else if (m.type === 'answer') {
      await pc.setRemoteDescription({ type: 'answer', sdp: m.sdp });
      remoteSet = true;
      for (const c of queued) pc.addIceCandidate(c).catch(() => {});
      queued = [];
    } else if (m.type === 'candidate') {
      const c = { candidate: m.candidate, sdpMid: m.sdpMid, sdpMLineIndex: m.sdpMLineIndex };
      if (remoteSet) pc.addIceCandidate(c).catch(() => {}); else queued.push(c);
    } else if (m.type === 'status') {
      const paused = !m.capturing;
      $('banner').style.display = paused ? 'block' : 'none';
      $('resume').style.display = paused ? '' : 'none';
      if (!paused) send({ type: 'refresh' });
    } else if (m.type === 'error') {
      toast(m.msg);
    }
  };
  ws.onclose = () => {
    stopRtc();
    if (authed) {
      authed = false;
      $('app').style.display = 'none';
      $('login').style.display = 'block';
      $('err').textContent = 'Disconnected. Enter the PIN to reconnect.';
    } else if (!$('err').textContent) {
      $('err').textContent = 'Could not connect.';
    }
  };
}
$('connect').onclick = connect;
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });

// ---- WebRTC: phone sends the screen as a video track; we receive only ----
async function startRtc() {
  stopRtc();
  pc = new RTCPeerConnection({ iceServers: [] }); // same Wi-Fi: host candidates are enough
  pc.addTransceiver('video', { direction: 'recvonly' });
  dc = pc.createDataChannel('ctl', { ordered: true });
  pc.ontrack = e => {
    // Ask the browser for the lowest possible playout buffering.
    try { e.receiver.playoutDelayHint = 0; } catch (_) {}
    try { e.receiver.jitterBufferTarget = 0; } catch (_) {}
    video.srcObject = e.streams[0] || new MediaStream([e.track]);
    video.play().catch(() => {});
  };
  pc.onicecandidate = e => {
    if (e.candidate) wsSend({ type: 'candidate', candidate: e.candidate.candidate,
      sdpMid: e.candidate.sdpMid, sdpMLineIndex: e.candidate.sdpMLineIndex });
  };
  pc.onconnectionstatechange = () => {
    if (pc && pc.connectionState === 'failed') toast('Video connection failed. Reload and reconnect.');
  };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  wsSend({ type: 'offer', sdp: offer.sdp });
}
function stopRtc() {
  remoteSet = false; queued = [];
  if (dc) { try { dc.close(); } catch (_) {} dc = null; }
  if (pc) { try { pc.close(); } catch (_) {} pc = null; }
  video.srcObject = null;
}
$('resume').onclick = () => send({ type: 'resume' });

// ---- Pointer -> tap / long-press / swipe ----
function norm(e) {
  const r = video.getBoundingClientRect();
  return {
    x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
    y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)),
  };
}
let down = null;
video.addEventListener('pointerdown', e => {
  video.setPointerCapture(e.pointerId);
  video.focus();
  down = { p: norm(e), px: e.clientX, py: e.clientY, t: performance.now() };
});
video.addEventListener('pointerup', e => {
  if (!down) return;
  const up = norm(e), dt = performance.now() - down.t;
  const moved = Math.hypot(e.clientX - down.px, e.clientY - down.py);
  if (moved < 10) {
    send({ type: dt >= 500 ? 'longpress' : 'tap', x: down.p.x, y: down.p.y });
  } else {
    send({ type: 'swipe', x1: down.p.x, y1: down.p.y, x2: up.x, y2: up.y,
           dur: Math.round(Math.min(1500, Math.max(80, dt))) });
  }
  down = null;
});
video.addEventListener('pointercancel', () => down = null);
video.addEventListener('contextmenu', e => { e.preventDefault(); send({ type: 'key', key: 'back' }); });

let lastWheel = 0;
video.addEventListener('wheel', e => {
  e.preventDefault();
  const now = performance.now();
  if (now - lastWheel < 250) return;
  lastWheel = now;
  const p = norm(e), d = e.deltaY > 0 ? -0.25 : 0.25; // wheel down = finger swipes up
  send({ type: 'swipe', x1: p.x, y1: p.y, x2: p.x, y2: Math.min(1, Math.max(0, p.y + d)), dur: 200 });
}, { passive: false });

// ---- Keyboard / paste -> text on the phone ----
document.addEventListener('keydown', e => {
  if (!authed || e.target.tagName === 'INPUT') return;
  if (e.key === 'Backspace') { send({ type: 'backspace' }); e.preventDefault(); }
  else if (e.key === 'Enter') { send({ type: 'enter' }); e.preventDefault(); }
  else if (e.key === 'Escape') { send({ type: 'key', key: 'back' }); }
  else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    send({ type: 'text', text: e.key }); e.preventDefault();
  }
});
document.addEventListener('paste', e => {
  if (!authed || e.target.tagName === 'INPUT') return;
  const t = e.clipboardData.getData('text');
  if (t) send({ type: 'text', text: t });
});

// ---- Toolbar ----
document.querySelectorAll('[data-key]').forEach(b => b.onclick = () => send({ type: 'key', key: b.dataset.key }));
$('wake').onclick = () => send({ type: 'wake' });
function sendField() { const v = $('txt').value; if (v) { send({ type: 'text', text: v }); $('txt').value = ''; } }
$('sendtxt').onclick = sendField;
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter') sendField(); });
</script>
</body>
</html>
